# Supabase CLI configuration for LOCAL development (`supabase start`).
# Production projects must be configured to match in the dashboard (see docs/PRODUCTION_DEPLOYMENT.md).
project_id = "nanglen"

[api]
enabled = true
port = 54321
# Only `public` is exposed. `private` and `extensions` must never be added here.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
major_version = 17

# seed.sql is DEMO DATA for the LOCAL stack only (`supabase start` / `supabase db reset`).
# - `supabase db push` never runs it (unless you pass --include-seed — don't, for production).
# - `supabase db reset --linked` WIPES the remote database AND runs this seed. Never use it on production.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "nanglen://auth"
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Guests are anonymous auth users. Protect with CAPTCHA/rate limits in production.
enable_anonymous_sign_ins = true
# Required to link a phone identity to an anonymous user while keeping the same user id.
enable_manual_linking = true

[auth.rate_limit]
anonymous_users = 30          # per hour per IP
email_sent = 30               # per hour (custom SMTP raises the real limit)
token_verifications = 30      # per 5 minutes per IP (OTP brute-force protection)

# Free launch identity: verified email (6-digit OTP). SMS is disabled because it is billed per message.
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = false
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

# Anonymous user -> linking an email sends this template. It must show {{ .Token }} (code), not a link.
[auth.email.template.email_change]
subject = "Your Nanglen code"
content_path = "./supabase/templates/email_otp.html"

# Returning user signing in on a new device.
[auth.email.template.magic_link]
subject = "Your Nanglen sign-in code"
content_path = "./supabase/templates/email_otp.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

# Production: configure free custom SMTP (e.g. Brevo free tier, or Gmail with an app password)
# in Dashboard > Authentication > SMTP. The built-in sender only delivers to project team members.

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets.venue-submission-media]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/heic", "image/webp"]

[storage.buckets.review-media]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/heic", "image/webp"]

[storage.buckets.avatars]
public = false
file_size_limit = "2MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]
